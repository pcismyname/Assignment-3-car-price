name: CI/CD

# Objective 3: on every push we run the unit tests (Continuous Integration);
# if they pass on main, we build + push the Docker image and deploy it to the
# CSIM server (Continuous Deployment).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------- #
  # CI: run the unit tests. Deployment is gated on this job passing.
  # ----------------------------------------------------------------- #
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests app/code/tests -q

  # ----------------------------------------------------------------- #
  # CD: only on a push to main, and only if `test` passed.
  # ----------------------------------------------------------------- #
  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/car-price-a3:latest

      - name: Deploy to the CSIM server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            # Write/refresh the A3 compose file so the server serves this image.
            cat > ~/docker-compose.yaml <<'EOF'
            services:
              web-st127004:
                image: pcismyname/car-price-a3:latest
                container_name: web-st127004
                networks:
                  - web
                labels:
                  - "traefik.enable=true"
                  - "traefik.http.routers.st127004.rule=Host(`web-st127004.ml.brain.cs.ait.ac.th`)"
                  - "traefik.http.routers.st127004.entrypoints=websecure"
                  - "traefik.http.routers.st127004.tls=true"
                  - "traefik.http.routers.st127004.tls.certresolver=letsencrypt"
                  - "traefik.http.services.st127004.loadbalancer.server.port=8501"
                restart: unless-stopped
            networks:
              web:
                external: true
            EOF
            cd ~
            docker compose pull
            docker compose up -d
