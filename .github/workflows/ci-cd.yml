name: CI/CD

# Objective 3: on every push we run the unit tests (Continuous Integration);
# if they pass on main, we build + push the Docker image (Continuous Deployment).
#
# How the image reaches the server (pull-based CD):
#   ml-brain only accepts SSH from inside the AIT network, so GitHub's runners
#   cannot SSH in (the connection times out). Instead, the `updater` container
#   in ~/a3/docker-compose.yaml on the server (docs/server-docker-compose.yaml)
#   pulls `latest` every 5 minutes and recreates web-st127004-a3 when it changed.
#   `latest` is only pushed after the tests pass, so a failing commit never
#   reaches the server.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------- #
  # CI: run the unit tests. Deployment is gated on this job passing.
  # ----------------------------------------------------------------- #
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests app/code/tests -q

  # ----------------------------------------------------------------- #
  # CD: only on a push to main, and only if `test` passed.
  # ----------------------------------------------------------------- #
  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/car-price-a3:latest

      - name: Deployment handled by the server's updater
        run: |
          echo "::notice::Pushed ${{ secrets.DOCKERHUB_USERNAME }}/car-price-a3:latest. The updater on ml-brain deploys it within 5 minutes (https://web-st127004-a3.ml.brain.cs.ait.ac.th)."
